# Animus en VPS — Supabase sigue en la nube (recomendado).
# Uso: cp deploy/env.production.example .env && docker compose up -d --build

services:
  animus:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
